name: Production CI/CD — ECS Fargate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write    # Required for OIDC
  contents: read
  security-events: write

env:
  AWS_REGION:           us-east-1
  ECR_REPOSITORY:       ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER:          ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE:          ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION:  ${{ secrets.ECS_TASK_DEFINITION }}
  CONTAINER_NAME:       ${{ secrets.CONTAINER_NAME }}

jobs:

  # ──────────────────────────────────────────
  # JOB 1 — Unit Tests
  # ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────
  # JOB 2 — Build Docker Image (once, reused everywhere)
  # ──────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      short-sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: flask-app:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/flask-app.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/flask-app.tar

  # ──────────────────────────────────────────
  # JOB 3 — Trivy Security Scan
  # ──────────────────────────────────────────
  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/flask-app.tar

      - name: Trivy scan (SARIF → GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flask-app:${{ steps.vars.outputs.short_sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy scan (table for logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flask-app:${{ steps.vars.outputs.short_sha }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

  # ──────────────────────────────────────────
  # JOB 4 — Integration Tests
  # ──────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load and start container
        run: |
          docker load --input /tmp/flask-app.tar
          docker run -d --name flask-test \
            -p 8080:8080 \
            flask-app:${{ steps.vars.outputs.short_sha }}

      - name: Wait for app ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8080/ && echo "Ready!" && break
            echo "Attempt $i/15 — waiting..."
            sleep 2
          done

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests pytest

      - name: Run integration tests
        env:
          APP_URL: http://localhost:8080
        run: pytest tests/integration/ -v

      - name: Container logs on failure
        if: failure()
        run: docker logs flask-test

      - name: Stop container
        if: always()
        run: docker stop flask-test && docker rm flask-test

  # ──────────────────────────────────────────
  # JOB 5 — Deploy to STAGING (auto)
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    outputs:
      image-uri: ${{ steps.push.outputs.image_uri }}
      short-sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # No access keys — OIDC token only ✅

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Tag and push to ECR
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker load --input /tmp/flask-app.tar

          # Tag with git SHA — immutable, traceable ✅
          docker tag flask-app:${{ steps.vars.outputs.short_sha }} \
            $REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}

          docker push $REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}

          echo "image_uri=$REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition > task-def.json

      - name: Inject new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image_uri }}

      - name: Deploy to staging ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Staging deployed
        run: echo "✅ Staging running image ${{ steps.push.outputs.image_uri }}"

  # ──────────────────────────────────────────
  # JOB 6 — Deploy to PRODUCTION (manual approval)
  # ──────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production    # ← triggers manual approval gate in GitHub
    env:
      IMAGE_URI: ${{ needs.deploy-staging.outputs.image-uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition > task-def.json

      - name: Inject image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to production ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Production deployed
        run: echo "✅ Production running image ${{ env.IMAGE_URI }}"

  # ──────────────────────────────────────────
  # JOB 7 — Rollback (runs only if prod deploy fails)
  # ──────────────────────────────────────────
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()   # ← only triggers if Job 6 fails

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get previous stable task definition
        id: prev
        run: |
          PREV_REVISION=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query 'taskDefinition.revision' \
            --output text)
          # Roll back to previous revision
          ROLLBACK_REVISION=$((PREV_REVISION - 1))
          echo "revision=$ROLLBACK_REVISION" >> $GITHUB_OUTPUT
          echo "Rolling back to revision: $ROLLBACK_REVISION"

      - name: Deploy previous task definition
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.ECS_TASK_DEFINITION }}:${{ steps.prev.outputs.revision }}
          
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          
          echo "⏪ Rolled back to revision ${{ steps.prev.outputs.revision }}"